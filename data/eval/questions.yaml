# Контрольные вопросы для оценки RAG (мини-набор из 10 вопросов по базе «Честный знак»).
#
# Формат каждого вопроса:
#   id               — уникальный идентификатор (q01..q10)
#   question         — текст вопроса
#   expected_answer  — что должно быть в ответе (кратко, по смыслу)
#   expected_sources — источники, которые должны быть использованы (опционально)
#   notes            — любые заметки (опционально)
#
# Вопросы можно править вручную в любой момент. /eval run читает актуальный файл.
questions:
  - id: q01
    question: "Что такое ТС ПИоТ и для чего он нужен?"
    expected_answer: "Техническое средство получения информации о товаре — программный модуль на кассе, через который с 2026 года выполняется обязательная проверка кодов маркировки в системе «Честный знак»."
    expected_sources: ["02_ts_piot.txt"]

  - id: q02
    question: "Что такое локальный модуль Честного знака (ЛМ ЧЗ)?"
    expected_answer: "Программное обеспечение для обмена данными между кассовым/учётным ПО и ГИС МТ, обеспечивающее офлайн-проверку кодов маркировки."
    expected_sources: ["01_lokalny_modul_chestny_znak.txt"]

  - id: q03
    question: "Каким постановлением Правительства РФ введено требование о работе кассы в связке с ТС ПИоТ?"
    expected_answer: "Постановление Правительства РФ от 21.11.2023 № 1944"
    expected_sources: ["02_ts_piot.txt"]

  - id: q04
    question: "С какой даты ТС ПИоТ становится обязательным модулем проверки кодов на кассе?"
    expected_answer: "с 28.12.2025"
    expected_sources: ["02_ts_piot.txt", "03_nastroyka_v_1c.txt"]

  - id: q05
    question: "Кто является оператором системы «Честный знак»?"
    expected_answer: "ООО «Оператор-ЦРПТ» (ЦРПТ, Центр развития перспективных технологий)"
    expected_sources: ["01_lokalny_modul_chestny_znak.txt", "04_chestny_znak_i_zakonodatelstvo.txt"]

  - id: q06
    question: "Что такое «Честный знак» и как технически реализуется маркировка товара?"
    expected_answer: "Национальная система цифровой маркировки и прослеживания товаров; маркировка реализуется нанесением уникального кода Data Matrix, сведения о котором фиксируются в ГИС МТ."
    expected_sources: ["04_chestny_znak_i_zakonodatelstvo.txt"]

  - id: q07
    question: "Что такое ГИС МТ?"
    expected_answer: "Государственная информационная система мониторинга за оборотом товаров."
    expected_sources: ["04_chestny_znak_i_zakonodatelstvo.txt", "06_dopolnitelno_chestny_znak.txt"]

  - id: q08
    question: "Из каких слоёв строится работа с маркировкой в решениях 1С?"
    expected_answer: "Конфигурация 1С, подсистема «Маркировка», локальный модуль Честного знака (ЛМ ЧЗ) и ТС ПИоТ."
    expected_sources: ["03_nastroyka_v_1c.txt"]

  - id: q09
    question: "Каковы первые шаги подготовки к маркировке (аудит)?"
    expected_answer: "Определить товарные группы под маркировку, проверить исключения, проверить кассовый парк, зарегистрироваться в ГИС МТ."
    expected_sources: ["07_prakticheskie_instrukcii.txt"]

  - id: q10
    question: "Какие товарные группы подпадают под обязательную маркировку «Честный знак»?"
    expected_answer: "Обувь, одежда, табак, лекарства, молочная продукция, вода, шины, парфюмерия, мясо и другие."
    expected_sources: ["07_prakticheskie_instrukcii.txt", "04_chestny_znak_i_zakonodatelstvo.txt"]
